name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: tariq-almalki
          filename: github-metrics.svg
          template: classic
          config_display: large
          config_timezone: Asia/Riyadh

          base: header, activity, community, repositories, metadata
          config_order: base.header, base.activity+community, base.repositories, followup, languages, notable, people

          plugin_followup: yes
          plugin_followup_sections: repositories
          plugin_languages: yes
          plugin_languages_limit: 12
          plugin_notable: yes
          plugin_people: yes
          plugin_people_types: followers, following
